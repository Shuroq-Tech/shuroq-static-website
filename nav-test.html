<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation System Test</title>
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Navigation System Test Results</h1>
    
    <div class="test-section">
        <h2>Navigation Loading Test</h2>
        <div id="nav-test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Functionality Test</h2>
        <div id="functionality-test-results"></div>
    </div>
    
    <!-- Navigation will be loaded here -->
    <nav id="main-nav">
        <div class="loading"></div>
    </nav>

    <script src="js/nav.js"></script>
    <script>
        const navResults = document.getElementById('nav-test-results');
        const funcResults = document.getElementById('functionality-test-results');
        
        function addNavResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            navResults.appendChild(div);
        }
        
        function addFuncResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            funcResults.appendChild(div);
        }
        
        // Test navigation loading
        addNavResult('Testing navigation system...', 'info');
        
        // Load navigation
        async function loadNavigation() {
            try {
                const response = await fetch('nav.html');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const navHTML = await response.text();
                
                // Replace the existing navigation
                const existingNav = document.querySelector('nav');
                if (existingNav) {
                    existingNav.innerHTML = navHTML;
                    addNavResult('✓ Navigation loaded successfully', 'success');
                }
                
                // Initialize navigation functionality
                setTimeout(() => {
                    initializeNavigation();
                    addNavResult('✓ Navigation functionality initialized', 'success');
                    testFunctionality();
                }, 500);
                
            } catch (error) {
                addNavResult(`✗ Error loading navigation: ${error.message}`, 'error');
            }
        }
        
        function testFunctionality() {
            addFuncResult('Testing navigation functionality...', 'info');
            
            // Test mobile menu button
            const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
            if (mobileMenuBtn) {
                addFuncResult('✓ Mobile menu button found', 'success');
            } else {
                addFuncResult('✗ Mobile menu button not found', 'error');
            }
            
            // Test nav links
            const navLinks = document.querySelector('.nav-links');
            if (navLinks) {
                addFuncResult('✓ Navigation links found', 'success');
            } else {
                addFuncResult('✗ Navigation links not found', 'error');
            }
            
            // Test dropdowns
            const servicesDropdown = document.querySelector('.services-dropdown');
            const companyDropdown = document.querySelector('.company-dropdown');
            const solutionsDropdown = document.querySelector('.solutions-dropdown');
            const resourcesDropdown = document.querySelector('.resources-dropdown');
            
            if (servicesDropdown) addFuncResult('✓ Services dropdown found', 'success');
            else addFuncResult('✗ Services dropdown not found', 'error');
            
            if (companyDropdown) addFuncResult('✓ Company dropdown found', 'success');
            else addFuncResult('✗ Company dropdown not found', 'error');
            
            if (solutionsDropdown) addFuncResult('✓ Solutions dropdown found', 'success');
            else addFuncResult('✗ Solutions dropdown not found', 'error');
            
            if (resourcesDropdown) addFuncResult('✓ Resources dropdown found', 'success');
            else addFuncResult('✗ Resources dropdown not found', 'error');
            
            // Test language button
            const langBtn = document.getElementById('langBtn');
            const langMenu = document.getElementById('langMenu');
            
            if (langBtn) addFuncResult('✓ Language button found', 'success');
            else addFuncResult('✗ Language button not found', 'error');
            
            if (langMenu) addFuncResult('✓ Language menu found', 'success');
            else addFuncResult('✗ Language menu not found', 'error');
            
            // Test global click handler
            setTimeout(() => {
                if (typeof globalClickHandler !== 'undefined') {
                    addFuncResult('✓ Global click handler initialized', 'success');
                } else {
                    addFuncResult('✗ Global click handler not found', 'error');
                }
                
                addFuncResult('Navigation system test completed!', 'info');
                addFuncResult('The navigation system is now optimized to prevent conflicts when creating new pages.', 'success');
            }, 1000);
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            loadNavigation();
        });
    </script>
</body>
</html>
