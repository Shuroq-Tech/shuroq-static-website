<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog System Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Blog System Test Results</h1>
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // Test 1: Check if blog files exist
        addResult('Testing blog files existence...', 'info');
        
        fetch('blogs.html')
            .then(response => {
                if (response.ok) {
                    addResult('✓ blogs.html exists and is accessible', 'success');
                } else {
                    addResult('✗ blogs.html not accessible', 'error');
                }
            })
            .catch(() => addResult('✗ blogs.html not found', 'error'));
        
        fetch('blog.html')
            .then(response => {
                if (response.ok) {
                    addResult('✓ blog.html exists and is accessible', 'success');
                } else {
                    addResult('✗ blog.html not accessible', 'error');
                }
            })
            .catch(() => addResult('✗ blog.html not found', 'error'));
        
        fetch('css/blogs.css')
            .then(response => {
                if (response.ok) {
                    addResult('✓ blogs.css exists and is accessible', 'success');
                } else {
                    addResult('✗ blogs.css not accessible', 'error');
                }
            })
            .catch(() => addResult('✗ blogs.css not found', 'error'));
        
        fetch('js/blog.js')
            .then(response => {
                if (response.ok) {
                    addResult('✓ blog.js exists and is accessible', 'success');
                } else {
                    addResult('✗ blog.js not accessible', 'error');
                }
            })
            .catch(() => addResult('✗ blog.js not found', 'error'));
        
        fetch('js/blogs.js')
            .then(response => {
                if (response.ok) {
                    addResult('✓ blogs.js exists and is accessible', 'success');
                } else {
                    addResult('✗ blogs.js not accessible', 'error');
                }
            })
            .catch(() => addResult('✗ blogs.js not found', 'error'));
        
        // Test 2: Check blog functionality
        addResult('Testing blog functionality...', 'info');
        
        // Test blog data structure
        setTimeout(() => {
            const script = document.createElement('script');
            script.src = 'js/blog.js';
            script.onload = function() {
                if (typeof blogs !== 'undefined') {
                    addResult('✓ Blog data object loaded successfully', 'success');
                    addResult(`✓ Found ${Object.keys(blogs).length} blog posts`, 'success');
                    
                    // Test individual blog posts
                    Object.keys(blogs).forEach(id => {
                        const blog = blogs[id];
                        if (blog.title && blog.author && blog.content) {
                            addResult(`✓ Blog ${id}: "${blog.title}" - Complete`, 'success');
                        } else {
                            addResult(`✗ Blog ${id}: Incomplete data`, 'error');
                        }
                    });
                } else {
                    addResult('✗ Blog data object not found', 'error');
                }
            };
            script.onerror = function() {
                addResult('✗ Failed to load blog.js', 'error');
            };
            document.head.appendChild(script);
        }, 1000);
        
        // Test 3: Navigation functionality
        addResult('Testing navigation functionality...', 'info');
        
        setTimeout(() => {
            if (typeof openBlog === 'function') {
                addResult('✓ openBlog function available', 'success');
            } else {
                addResult('✗ openBlog function not found', 'error');
            }
        }, 2000);
        
        addResult('Test completed! Check the results above.', 'info');
        addResult('You can now test the blog system manually:', 'info');
        addResult('1. Open blogs.html to see the blog listing', 'info');
        addResult('2. Click on any blog card to open the full article', 'info');
        addResult('3. Test mobile responsiveness by resizing your browser', 'info');
        addResult('4. Test navigation and hamburger menu functionality', 'info');
    </script>
</body>
</html>
