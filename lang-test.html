<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Button Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Language Button Functionality Test</h1>
    
    <div class="test-section">
        <h2>JavaScript Functions Test</h2>
        <div id="js-test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Translation Test</h2>
        <div id="translation-test-results"></div>
        <p data-i18n="nav_company">Company</p>
        <p data-i18n="nav_aboutus">About Us</p>
        <p data-i18n="nav_services">Services</p>
    </div>

    <!-- Load required scripts -->
    <script src="js/main_lang.js"></script>
    <script>
        const jsResults = document.getElementById('js-test-results');
        const transResults = document.getElementById('translation-test-results');
        
        function addResult(message, type = 'info', container = jsResults) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            container.appendChild(div);
        }
        
        // Test 1: Check if changeLanguage function exists
        addResult('Testing changeLanguage function...', 'info');
        
        if (typeof changeLanguage === 'function') {
            addResult('✓ changeLanguage function found', 'success');
        } else {
            addResult('✗ changeLanguage function not found', 'error');
        }
        
        // Test 2: Check if translations object exists
        addResult('Testing translations object...', 'info');
        
        if (typeof translations !== 'undefined') {
            addResult('✓ translations object found', 'success');
            
            if (translations.en && translations.ar) {
                addResult('✓ Both English and Arabic translations available', 'success');
            } else {
                addResult('✗ Missing language translations', 'error');
            }
        } else {
            addResult('✗ translations object not found', 'error');
        }
        
        // Test 3: Test language switching
        addResult('Testing language switching...', 'info');
        
        setTimeout(() => {
            try {
                // Test English
                changeLanguage('en');
                addResult('✓ English language loaded', 'success');
                
                // Test Arabic
                changeLanguage('ar');
                addResult('✓ Arabic language loaded', 'success');
                
                // Test back to English
                changeLanguage('en');
                addResult('✓ Language switching working correctly', 'success');
                
                transResults.innerHTML = '<p>Current translations should be visible above</p>';
                
            } catch (error) {
                addResult(`✗ Error during language switching: ${error.message}`, 'error');
            }
        }, 1000);
        
        // Test 4: Check data-i18n elements
        addResult('Testing data-i18n elements...', 'info');
        
        setTimeout(() => {
            const i18nElements = document.querySelectorAll('[data-i18n]');
            if (i18nElements.length > 0) {
                addResult(`✓ Found ${i18nElements.length} elements with data-i18n`, 'success');
                
                // Check if translations are applied
                let translatedCount = 0;
                i18nElements.forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (translations.en[key] && element.textContent === translations.en[key]) {
                        translatedCount++;
                    }
                });
                
                if (translatedCount === i18nElements.length) {
                    addResult('✓ All elements translated correctly', 'success');
                } else {
                    addResult(`✗ Only ${translatedCount}/${i18nElements.length} elements translated`, 'error');
                }
            } else {
                addResult('✗ No elements with data-i18n found', 'error');
            }
        }, 2000);
        
        addResult('Language button test completed!', 'info');
    </script>
</body>
</html>
